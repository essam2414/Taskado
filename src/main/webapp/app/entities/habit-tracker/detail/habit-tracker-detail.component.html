<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (habitTracker(); as habitTrackerRef) {
      <div>
        <h2 data-cy="habitTrackerDetailsHeading"><span>Habit Tracker</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ habitTrackerRef.id }}</span>
          </dd>
          <dt><span>Name</span></dt>
          <dd>
            <span>{{ habitTrackerRef.name }}</span>
          </dd>
          <dt><span>Repeat Frequency</span></dt>
          <dd>
            <span>{{ habitTrackerRef.repeatFrequency }}</span>
          </dd>
          <dt><span>Start Date</span></dt>
          <dd>
            <span>{{ habitTrackerRef.startDate | formatMediumDatetime }}</span>
          </dd>
          <dt><span>Streak</span></dt>
          <dd>
            <span>{{ habitTrackerRef.streak }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/habit-tracker', habitTrackerRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
