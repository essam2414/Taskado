<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (goal(); as goalRef) {
      <div>
        <h2 data-cy="goalDetailsHeading"><span>Goal</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ goalRef.id }}</span>
          </dd>
          <dt><span>Title</span></dt>
          <dd>
            <span>{{ goalRef.title }}</span>
          </dd>
          <dt><span>Description</span></dt>
          <dd>
            <span>{{ goalRef.description }}</span>
          </dd>
          <dt><span>Start Date</span></dt>
          <dd>
            <span>{{ goalRef.startDate | formatMediumDatetime }}</span>
          </dd>
          <dt><span>End Date</span></dt>
          <dd>
            <span>{{ goalRef.endDate | formatMediumDatetime }}</span>
          </dd>
          <dt><span>Progress</span></dt>
          <dd>
            <span>{{ goalRef.progress }}</span>
          </dd>
          <dt><span>User</span></dt>
          <dd>
            <span>{{ goalRef.user?.id }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/goal', goalRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
