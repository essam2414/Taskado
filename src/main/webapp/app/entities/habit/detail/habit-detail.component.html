<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (habit(); as habitRef) {
      <div>
        <h2 data-cy="habitDetailsHeading"><span>Habit</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ habitRef.id }}</span>
          </dd>
          <dt><span>Name</span></dt>
          <dd>
            <span>{{ habitRef.name }}</span>
          </dd>
          <dt><span>Start Date</span></dt>
          <dd>
            <span>{{ habitRef.startDate | formatMediumDatetime }}</span>
          </dd>
          <dt><span>Streak</span></dt>
          <dd>
            <span>{{ habitRef.streak }}</span>
          </dd>
          <dt><span>Completion Rate</span></dt>
          <dd>
            <span>{{ habitRef.completionRate }}</span>
          </dd>
          <dt><span>User</span></dt>
          <dd>
            <span>{{ habitRef.user?.id }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/habit', habitRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
