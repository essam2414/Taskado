<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-habit-heading" data-cy="HabitCreateUpdateHeading">Create or edit a Habit</h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <!-- Name field -->
        <div class="mb-3" *ngIf="editForm.get('name') as nameRef">
          <label class="form-label" for="field_name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
          <div *ngIf="nameRef.invalid && (nameRef.dirty || nameRef.touched)">
            <div *ngIf="nameRef.errors?.required">
              <small class="form-text text-danger">This field is required.</small>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_repeat_type">Repeat Type</label>

          <div class="dropdown dropdown-select habit-dropdown" [class.open]="habitDropdownOpen">
            <div class="dropdown-btn" [class.open]="habitDropdownOpen" (click)="toggleHabitDropdown()">
              <span> {{ activeRepeatType }} </span>
              <fa-icon [icon]="'chevron-down'"></fa-icon>
            </div>

            <div class="habit-repeat-menu" *ngIf="habitDropdownOpen">
              <div class="repeat-type-tabs">
                <button type="button" class="btn-filter" [class.active]="activeRepeatType === 'daily'" (click)="setRepeatType('daily')">
                  Daily
                </button>
                <button type="button" class="btn-filter" [class.active]="activeRepeatType === 'weekly'" (click)="setRepeatType('weekly')">
                  Weekly
                </button>
                <button type="button" class="btn-filter" [class.active]="activeRepeatType === 'custom'" (click)="setRepeatType('custom')">
                  Custom
                </button>
              </div>

              <div *ngIf="activeRepeatType === 'daily'">
                <label class="repeat-label">Times per day:</label>
                <select [(ngModel)]="timesPerDay" [ngModelOptions]="{ standalone: true }" class="form-select">
                  <option *ngFor="let n of [1, 2, 3, 4]" [value]="n">{{ n }} time{{ n > 1 ? 's' : '' }} per day</option>
                </select>
              </div>

              <div *ngIf="activeRepeatType === 'weekly'">
                <label class="repeat-label">Select days:</label>

                <div class="select-days">
                  <button
                    *ngFor="let day of getCurrentWeekDates()"
                    type="button"
                    class="btn-filter"
                    [class.active]="selectedWeekDays.includes(day)"
                    (click)="toggleWeekDay(day)"
                  >
                    {{ day | date: 'EEE' }}
                  </button>
                </div>
              </div>

              <div *ngIf="activeRepeatType === 'custom'">
                <label class="repeat-label">Repeat every:</label>
                <div class="custom-repeat">
                  <input
                    type="number"
                    [(ngModel)]="customEveryXDays"
                    [ngModelOptions]="{ standalone: true }"
                    min="1"
                    class="form-control"
                  />
                  <span>day(s)</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Category field -->
        <div class="mb-3">
          <label class="form-label" for="field_category">Category</label>

          <!-- Category Dropdown -->
          <div class="dropdown dropdown-select" [class.open]="categoryDropdownOpen">
            <div class="dropdown-btn" (click)="toggleCategoryDropdown()">
              <div *ngIf="selectedCategory" class="task-tag task-category" [ngStyle]="getCategoryStyle(selectedCategory)">
                {{ selectedCategory.name }}
              </div>

              <div *ngIf="!selectedCategory">Select Category</div>

              <fa-icon icon="chevron-down"></fa-icon>
            </div>

            <ul class="dropdown-menu" *ngIf="categoryDropdownOpen">
              <li
                class="category-option"
                *ngFor="let categoryOption of categoriesSharedCollection"
                (click)="selectCategory(categoryOption)"
              >
                <div class="task-tag task-category" [ngStyle]="getCategoryStyle(categoryOption)">
                  {{ categoryOption.name }}
                </div>
                <button type="button" class="delete-category-btn" (click)="deleteCategory(categoryOption, $event)">✕</button>
              </li>

              <li (click)="selectCategory(null)">
                <div class="task-tag NO_CATEGORY">
                  <fa-icon icon="ban"></fa-icon>
                  <span>No Category</span>
                </div>
              </li>

              <div class="category-dropdown-footer">
                <button type="button" class="add-category-btn" [class.active]="addCategoryOpen" (click)="toggleAddCategory()">
                  <fa-icon icon="plus"></fa-icon> Add category
                </button>
              </div>

              <div *ngIf="addCategoryOpen" class="add-category-form">
                <div class="add-category-input">
                  <input
                    #addCategoryInput
                    class="category-label-input"
                    type="text"
                    placeholder="Enter a label..."
                    [(ngModel)]="newCategoryName"
                    [ngModelOptions]="{ standalone: true }"
                    (keydown.enter)="addCategoryFromInput($event)"
                  />
                  <input
                    type="color"
                    [(ngModel)]="newCategoryColor"
                    [ngModelOptions]="{ standalone: true }"
                    class="color-picker"
                    aria-label="Select category color"
                  />
                </div>

                <small class="hint">
                  Press
                  <svg
                    class="key-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    role="img"
                    aria-label="Enter key icon"
                    focusable="false"
                  >
                    <path
                      d="M23,2c-.55,0-1,.45-1,1V11c0,1.65-1.35,3-3,3H2.58l5.14-5.3c.38-.4,.37-1.03-.02-1.41-.4-.38-1.03-.38-1.41,.02L.88,12.88c-1.17,1.17-1.17,3.07-.01,4.23l5.41,5.59c.2,.2,.46,.3,.72,.3s.5-.09,.7-.28c.4-.38,.41-1.02,.02-1.41l-5.14-5.3H19c2.76,0,5-2.24,5-5V3c0-.55-.45-1-1-1Z"
                    />
                  </svg>
                  to add
                </small>
              </div>
            </ul>
          </div>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
