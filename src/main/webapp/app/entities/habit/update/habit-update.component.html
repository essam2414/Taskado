<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-habit-heading" data-cy="HabitCreateUpdateHeading">Create or edit a Habit</h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <!-- ID field (if editing an existing habit) -->
        <div *ngIf="editForm.controls.id.value !== null" class="mb-3">
          <label class="form-label" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" readonly />
        </div>

        <!-- Name field -->
        <div class="mb-3" *ngIf="editForm.get('name') as nameRef">
          <label class="form-label" for="field_name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
          <div *ngIf="nameRef.invalid && (nameRef.dirty || nameRef.touched)">
            <div *ngIf="nameRef.errors?.required">
              <small class="form-text text-danger">This field is required.</small>
            </div>
          </div>
        </div>

        <!-- Category field -->
        <div class="mb-3">
          <label class="form-label" for="field_category">Category</label>
          <select
            class="form-control"
            id="field_category"
            data-cy="category"
            name="category"
            formControlName="category"
            [compareWith]="compareCategory"
          >
            <option [ngValue]="null"></option>
            <option *ngFor="let categoryOption of categoriesSharedCollection; index as i" [ngValue]="categoryOption">
              {{ categoryOption.id }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
