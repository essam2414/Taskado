<div>
  <!-- Page heading & buttons -->
  <h2 id="page-heading" data-cy="HabitHeading" class="mb-4">
    <span>Habits</span>
    <div class="d-flex justify-content-end">
      <!-- Refresh list -->
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined"></fa-icon>
        <span>Refresh list</span>
      </button>

      <!-- Create a new Habit -->
      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-habit"
        [routerLink]="['/habit/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span>Create a new Habit</span>
      </button>
    </div>
  </h2>

  <!-- JHipster alert components for errors/messages -->
  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  <!-- If there are no habits, display a warning -->
  <div class="alert alert-warning" id="no-result" *ngIf="habits?.length === 0">
    <span>No Habits found</span>
  </div>

  <!-- Otherwise, show the habit list -->
  <div class="habit-list" *ngIf="habits && habits.length > 0">
    @for (habit of habits; track trackId(habit)) {
      <!-- Make the item a flex container, name on left, streak on right -->
      <div class="taskado-card" (click)="editHabit(habit)">
        <div class="habit-info">
          <input
            type="checkbox"
            class="form-check-input taskado-checkbox"
            [checked]="habit.completed"
            (change)="toggleCompleted(habit)"
            (click)="$event.stopPropagation()"
            id="habit-{{ habit.id }}"
          />
          <!-- Left side: the habit name -->
          <div>
            <strong>{{ habit.name }}</strong>
          </div>
        </div>

        <!-- Right side: the streak + fire icon -->
        <div>{{ habit.streak }} 🔥</div>
      </div>
    }
  </div>
</div>
