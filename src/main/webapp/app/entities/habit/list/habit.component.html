<div>
  <div class="habit-header">
    <h2 id="page-heading" data-cy="HabitHeading">Habits</h2>

    <button
      id="jh-create-entity"
      data-cy="entityCreateButton"
      class="header-btn jh-create-entity create-habit"
      [routerLink]="['/habit/new']"
    >
      <fa-icon icon="plus"></fa-icon>
      <span>Create a new habit</span>
    </button>
  </div>

  <jhi-alert-error></jhi-alert-error>
  <jhi-alert></jhi-alert>

  @if (habits?.length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span>No Habits found</span>
    </div>
  }

  @if (habits && habits.length > 0) {
    <div class="habit-container">
      <!-- Header -->
      <div class="habit-week habit-row">
        <div></div>
        <div *ngFor="let day of daysOfWeek" class="habit-day">{{ day }}</div>
        <div></div>
      </div>

      <!-- Habit Rows -->
      <div class="habit-list">
        <div *ngFor="let habit of habits; trackBy: trackByHabitId" class="app-card habit-row" (click)="editHabit(habit)">
          <div class="habit-name">{{ habit.name }}</div>

          <!-- 7 Days Checkboxes -->
          <div *ngFor="let day of daysOfWeek; let i = index" class="habit-day">
            <input
              type="checkbox"
              class="custom-checkbox"
              [checked]="habit.completedDates?.includes(day) ?? false"
              (change)="toggleDayCompleted(habit, i)"
              (click)="$event.stopPropagation()"
            />
          </div>

          <!-- Streak -->
          <div class="habit-streak">{{ habit.streak }} 🔥</div>
        </div>
      </div>
    </div>
  }
</div>
