<div>
  <div class="entity-header">
    <h2>Notes</h2>

    <div class="input-group p-4">
      <input type="text" class="form-control" placeholder="Search notes..." [(ngModel)]="searchQuery" (keyup.enter)="search()" />
      <button class="btn btn-outline-secondary" type="button" (click)="search()">Search</button>
      <button class="btn btn-outline-danger" type="button" (click)="clearSearch()">Clear</button>
    </div>
  </div>

  <div *ngIf="filteredNotes.length === 0" class="alert alert-warning">No notes found.</div>

  <div class="entity-list">
    <div *ngFor="let note of filteredNotes" class="app-card" (click)="editNote(note)">
      <div>
        <h5 class="mb-1">{{ note.title }}</h5>
        <p class="mb-1">{{ note.content }}</p>
      </div>
    </div>

    <div class="mt-4">
      <input class="form-control" placeholder="New note title" [(ngModel)]="newNoteTitle" (keyup.enter)="addNote()" />
      <button class="btn btn-success mt-2" (click)="addNote()">Add Note</button>
    </div>
  </div>
</div>
