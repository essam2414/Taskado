<div>
  <h2 id="page-heading" data-cy="TaskHeading">Tasks</h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <div class="table-responsive table-entities" id="entities">
    <table class="table table-hover" aria-describedby="page-heading">
      <tbody>
        @for (task of tasks; track trackId(task)) {
          <tr data-cy="entityTable" (click)="viewTask(task)" class="task-row" [ngClass]="{ completed: task.completed }">
            <td>
              <div class="form-check d-flex gap-4">
                <input
                  class="form-check-input custom-checkbox"
                  type="checkbox"
                  [checked]="task.completed"
                  (change)="toggleCompleted(task)"
                  (click)="$event.stopPropagation()"
                  id="task-{{ task.id }}"
                />

                <label class="form-check-label" for="task-{{ task.id }}">
                  <div class="task-title">{{ task.title }}</div>
                  <div class="task-description">{{ task.description }}</div>
                </label>
              </div>
            </td>

            <td class="task-priority">
              <span class="priority-dot" [ngClass]="task.priority"></span>
              {{
                { null: '', LOW: 'Low Priority', MEDIUM: 'Medium Priority', HIGH: 'High Priority', CRITICAL: 'Critical Priority' }[
                  task.priority ?? 'null'
                ]
              }}
            </td>

            <td>
              @if (task.category) {
                <div>
                  <a [routerLink]="['/task-category', task.category.id, 'view']">{{ task.category.id }}</a>
                </div>
              }
            </td>

            <td class="task-date">{{ formatTaskDate(task.dueDate) }}</td>
          </tr>
        }
      </tbody>
    </table>

    <div class="d-flex justify-content-start">
      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-task"
        [routerLink]="['/task/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span>Add task</span>
      </button>
    </div>
  </div>
</div>
