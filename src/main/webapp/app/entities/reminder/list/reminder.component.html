<div>
  <!-- SIDEBAR -->
  <div class="entity-header">
    <div class="entity-header-left">
      <h3>Reminders</h3>

      <!-- Navigation Buttons -->
      <div class="entity-filters">
        <button class="btn-filter" (click)="setFilter('all')"><fa-icon icon="calendar-alt"></fa-icon> All</button>
        <button class="btn-filter" (click)="setFilter('today')"><fa-icon icon="sun"></fa-icon> Today</button>
      </div>
    </div>

    <!-- Add Reminder Button -->
    <button class="btn-add" (click)="toggleAddForm()">+ Add Reminder</button>
  </div>

  <!-- MAIN CONTENT AREA -->
  <div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 style="margin: 0">{{ activeFilter }}</h3>
      <span class="badge bg-secondary fs-6">{{ filteredReminders.length }}</span>
    </div>

    <!-- Alerts -->
    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <!-- Reminder Form -->
    <div class="card mb-4" style="border: 1px solid #e0e0e0" *ngIf="showAddForm">
      <div class="card-body">
        <h5 class="card-title">Add a New Reminder</h5>
        <form (ngSubmit)="onAddReminder()" #reminderForm="ngForm">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" name="title" class="form-control" required [(ngModel)]="newReminder.title" />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" [(ngModel)]="newReminder.description"></textarea>
          </div>
          <div class="mb-3">
            <label for="reminderDate" class="form-label">Reminder Date</label>
            <input
              type="datetime-local"
              id="reminderDate"
              name="reminderDate"
              class="form-control"
              required
              [min]="minDateTime"
              [(ngModel)]="newReminder.reminderDate"
            />
          </div>
          <button type="submit" class="btn btn-success" [disabled]="reminderForm.invalid">Save</button>
          <button type="button" class="btn btn-secondary" (click)="toggleAddForm()">Cancel</button>
        </form>
      </div>
    </div>

    <!-- No Reminders -->
    <div class="alert alert-info" *ngIf="filteredReminders.length === 0 && !showAddForm">
      <strong>No Reminders found</strong>
    </div>

    <!-- Reminder List -->
    <div *ngIf="filteredReminders.length > 0">
      <div class="entity-list" *ngFor="let reminder of filteredReminders">
        <div
          class="app-card p-3 mb-3 rounded d-flex justify-content-between align-items-center"
          [ngClass]="{ 'bg-warning-subtle': isToday(reminder) }"
        >
          <div>
            <div class="fw-bold fs-5"><fa-icon icon="bell" class="me-2 text-warning"></fa-icon> {{ reminder.title }}</div>
            <div class="fs-6 text-muted" *ngIf="reminder.description">
              {{ reminder.description }}
            </div>
            <div class="text-secondary">
              {{ parseDate(reminder.reminderDate)?.toDate() | date: 'medium' }}
            </div>
          </div>

          <!-- Actions -->
          <div>
            <a [routerLink]="['/reminder', reminder.id, 'edit']" class="btn btn-outline-secondary btn-sm me-2">
              <fa-icon icon="pencil-alt"></fa-icon> Edit
            </a>
            <button type="button" class="btn btn-outline-danger btn-sm" (click)="delete(reminder)">
              <fa-icon icon="times"></fa-icon> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
