<div class="pomodoro-container text-center my-4">
  <h2>Pomodoro Timer</h2>
  <div
    class="timer-display mx-auto my-4 border rounded-circle d-flex align-items-center justify-content-center"
    [ngClass]="{ 'bg-danger text-white': timerRunning, 'bg-secondary text-white': !timerRunning }"
  >
    <span class="display-3">{{ formattedTime }}</span>
  </div>
  <div class="timer-controls">
    <button class="btn btn-primary mx-2" (click)="startTimer()" [disabled]="timerRunning">Start</button>
    <button class="btn btn-warning mx-2" (click)="pauseTimer()" [disabled]="!timerRunning">Pause</button>
    <button class="btn btn-secondary mx-2" (click)="resetTimer()">Reset</button>
  </div>
</div>
