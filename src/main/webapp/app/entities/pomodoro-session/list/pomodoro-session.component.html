<div class="pomodoro-container text-center my-4">
  <h2>Pomodoro Timer</h2>

  <div class="btn-group mb-4" role="group">
    <button
      class="btn"
      [ngClass]="{ 'btn-danger': currentMode === 'pomodoro', 'btn-outline-danger': currentMode !== 'pomodoro' }"
      (click)="switchMode('pomodoro')"
    >
      Pomodoro
    </button>
    <button
      class="btn"
      [ngClass]="{ 'btn-success': currentMode === 'shortBreak', 'btn-outline-success': currentMode !== 'shortBreak' }"
      (click)="switchMode('shortBreak')"
    >
      Short Break
    </button>
    <button
      class="btn"
      [ngClass]="{ 'btn-primary': currentMode === 'longBreak', 'btn-outline-primary': currentMode !== 'longBreak' }"
      (click)="switchMode('longBreak')"
    >
      Long Break
    </button>
  </div>

  <div class="timer-display mx-auto my-4 border rounded-circle bg-danger text-white d-flex align-items-center justify-content-center">
    <span class="display-3">{{ formattedTime }}</span>
  </div>

  <div class="timer-controls">
    <button class="btn btn-primary mx-2" (click)="startTimer()" [disabled]="timerRunning">Start</button>
    <button class="btn btn-warning mx-2" (click)="pauseTimer()" [disabled]="!timerRunning">Pause</button>
    <button class="btn btn-secondary mx-2" (click)="resetTimer()">Reset</button>
  </div>
</div>
