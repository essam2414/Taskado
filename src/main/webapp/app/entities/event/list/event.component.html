<div>
  <h2 id="page-heading" data-cy="EventHeading">
    <span>Calendar</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined"></fa-icon>
        <span>Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-event"
        [routerLink]="['/event/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span>Create a new Event</span>
      </button>
    </div>
  </h2>

  <div class="calendar-container">
    <!-- Navigation for Previous/Next Month -->
    <div class="calendar-header">
      <button class="btn btn-secondary" (click)="changeMonth(-1)">❮</button>
      <h3>{{ currentDate.toLocaleString('default', { month: 'long', year: 'numeric' }) }}</h3>
      <button class="btn btn-secondary" (click)="changeMonth(1)">❯</button>
    </div>
    <!-- Days of the Week -->
    <div class="calendar-grid">
      <div class="day-header" *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
        {{ day }}
      </div>

      <!-- Actual Dates -->
      <div class="calendar-day" *ngFor="let day of calendarDays">
        <button *ngIf="day" class="date-button" (click)="selectDate(day)">
          {{ day }}
        </button>
      </div>
    </div>
  </div>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>
</div>
