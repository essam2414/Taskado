@if (productivityReport) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(productivityReport.id!)">
    <div class="modal-header" style="border-bottom: none; display: flex; justify-content: center; padding-top: 30px">
      <h4 class="modal-title" data-cy="productivityReportDeleteDialogHeading" style="font-size: 24px; font-weight: 600">
        🗑️ Confirm Deletion
      </h4>
    </div>

    <div class="modal-body" style="text-align: center; padding: 20px 30px; font-size: 18px; color: #333">
      <p>Are you sure you want to delete this <strong>Productivity Report</strong>?</p>
    </div>

    <div class="modal-footer" style="display: flex; justify-content: center; gap: 20px; border-top: none; padding-bottom: 30px">
      <button
        type="button"
        class="btn"
        (click)="cancel()"
        style="background-color: #6c757d; color: white; padding: 10px 24px; border-radius: 6px; font-size: 16px"
        onmouseover="this.style.backgroundColor='#5a6268'"
        onmouseout="this.style.backgroundColor='#6c757d'"
      >
        Cancel
      </button>

      <button
        id="jhi-confirm-delete-productivityReport"
        data-cy="entityConfirmDeleteButton"
        type="submit"
        class="btn"
        style="background-color: #dc3545; color: white; padding: 10px 24px; border-radius: 6px; font-size: 16px"
        onmouseover="this.style.backgroundColor='#c82333'"
        onmouseout="this.style.backgroundColor='#dc3545'"
      >
        Delete
      </button>
    </div>
  </form>
}
