<!-- Guest Mode Banner (Visible Only for Guests) -->
<div *ngIf="isGuest" class="guest-banner">
  <div class="guest-header">
    Guest mode: <span class="time">{{ guestTimeLeft }}.</span>
  </div>

  <div class="guest-content">
    Want full access?
    <a (click)="handleGuestSignupClick()">
      Create an account
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M19.5,0H10.5c-.828,0-1.5,.671-1.5,1.5s.672,1.5,1.5,1.5h8.379L.439,21.439c-.586,.585-.586,1.536,0,2.121,.293,.293,.677,.439,1.061,.439s.768-.146,1.061-.439L21,5.121V13.5c0,.829,.672,1.5,1.5,1.5s1.5-.671,1.5-1.5V4.5c0-2.481-2.019-4.5-4.5-4.5Z"
        />
      </svg>
    </a>
  </div>
</div>

<!-- Main Layout -->
<div class="layout" [class.expanded]="!sidebarService.isCollapsed() && account() !== null && !currentRouteIsLandingPage">
  @if (account() !== null && !currentRouteIsLandingPage) {
    <jhi-sidebar></jhi-sidebar>
  }

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
