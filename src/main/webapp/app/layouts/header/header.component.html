<div class="landing-header">
  <div class="header-left">
    <a class="logo" routerLink="/">
      <img src="/content/images/logo.png" alt="Taskado Logo" class="logo-img" />
      <h2 class="logo-text">taskado</h2>
    </a>
    <a class="team-info" href="https://github.com/uob-team-project/team45" target="_blank" rel="noopener noreferrer">
      <span>Team 45 • {{ version }}</span>
    </a>
  </div>

  <!-- NAVIGATION (Hidden on mobile) -->
  <div class="header-nav">
    <a href="#hero" [class.active]="activeSection === 'hero'">Home</a>
    <a href="#features" [class.active]="activeSection === 'features'">Features</a>
    <a href="#dashboard" [class.active]="activeSection === 'dashboard'">Dashboard</a>
    <a href="#a11y" [class.active]="activeSection === 'a11y'">Accessibility</a>
    <a href="#reviews" [class.active]="activeSection === 'reviews'">Testimonials</a>
    <a href="#cta" [class.active]="activeSection === 'cta'">Get Started</a>
  </div>

  <div class="header-btns">
    <button class="btn login" (click)="login()">Login</button>
    <button class="btn btn-primary btn-rounded" routerLink="/account/register">Sign Up</button>
  </div>

  <!-- MOBILE MENU TOGGLE -->
  <button class="menu-toggle" (click)="toggleSidebar()">
    <fa-icon icon="bars"></fa-icon>
  </button>

  <!-- MOBILE SIDEBAR -->
  <div class="mobile-sidebar" [class.open]="sidebarOpen">
    <button class="close-sidebar" (click)="toggleSidebar()">
      <fa-icon icon="times"></fa-icon>
    </button>

    <div class="mobile-sidebar-nav">
      <a href="#hero" [class.active]="activeSection === 'hero'" (click)="setActive('hero')">Home</a>
      <a href="#features" [class.active]="activeSection === 'features'" (click)="setActive('features')">Features</a>
      <a href="#dashboard" [class.active]="activeSection === 'dashboard'" (click)="setActive('dashboard')">Dashboard</a>
      <a href="#a11y" [class.active]="activeSection === 'a11y'" (click)="setActive('a11y')">Accessibility</a>
      <a href="#reviews" [class.active]="activeSection === 'reviews'" (click)="setActive('reviews')">Testimonials</a>
      <a href="#cta" [class.active]="activeSection === 'cta'" (click)="setActive('cta')">Get Started</a>
    </div>

    <div class="mobile-sidebar-btns">
      <button class="btn btn-primary" routerLink="/account/register" (click)="toggleSidebar()">Sign Up</button>
      <button class="btn btn-outline" (click)="login(); toggleSidebar()">Log in</button>
    </div>
  </div>
</div>
