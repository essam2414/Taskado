      <div>No tasks due today. Enjoy your day! 🎉</div>
    </div>
  } @else {
    <div class="task-list">
      <div class="task" *ngFor="let task of tasks()">
        <label class="task-label">
          <input
            type="checkbox"
            (change)="toggleCompleted(task)"
            [checked]="task.completed"
            class="form-check-input custom-checkbox"
            [attr.aria-checked]="task.completed"
            [attr.aria-label]="'Mark ' + task.title + ' as ' + (task.completed ? 'incomplete' : 'complete')"
          />
          <span [class.completed]="task.completed">{{ task.title }}</span>
        </label>
      </div>
    </div>
  }

  <div class="quick-add" [class.active]="newTaskTitle.trim()">
    <input
      type="text"
      class="task-input btn-content"
      [(ngModel)]="newTaskTitle"
      placeholder="Start typing to add a task..."
      (keyup.enter)="addTask(newTaskTitle)"
    />

    <button
      class="btn-add-icon jh-create-entity create-task"
      (click)="addTask(newTaskTitle)"
      [disabled]="!newTaskTitle.trim()"
      aria-label="Add task"
    >
      <fa-icon icon="plus"></fa-icon>
    </button>
  </div>
</div>
