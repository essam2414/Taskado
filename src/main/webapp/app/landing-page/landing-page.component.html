<jhi-header></jhi-header>

<div class="landing-container">
  <div class="landing-text">
    <h1 class="landing-title">Take charge of your day, effortlessly.</h1>
    <p class="landing-subtitle">A clean, intuitive way to manage your tasks, build habits, and stay focused.</p>
  </div>

  <div class="landing-buttons">
    <div class="account-options">
      <button class="btn btn-primary" routerLink="/account/register">Get started</button>
      <button class="btn" (click)="login()">Log in</button>
    </div>

    <p class="guest-option">
      <a routerLink="/dashboard">Continue as guest</a>
    </p>
  </div>
</div>
