<div>
  <h2>Settings</h2>

  <div class="settings-container">
    <!-- Sidebar (Tabs) -->
    <div class="settings-tabs">
      <button class="tab-button" [class.active]="activeTab === 'account'" (click)="setActiveTab('account')">
        <fa-icon icon="user"></fa-icon> Account
      </button>
      <button class="tab-button" [class.active]="activeTab === 'appearance'" (click)="setActiveTab('appearance')">
        <fa-icon icon="palette"></fa-icon> Appearance
      </button>
    </div>

    <div class="settings-content">
      <!-- Account Settings -->
      <div *ngIf="activeTab === 'account'">
        @if (settingsForm.value.login) {
          <h2 class="auth-title">User settings</h2>
        }

        @if (success()) {
          <div class="alert alert-success"><strong>Settings saved!</strong></div>
        }

        <jhi-alert-error></jhi-alert-error>

        @if (settingsForm.value.login) {
          <form name="form" (ngSubmit)="save()" [formGroup]="settingsForm" novalidate>
            <div class="auth-input-group">
              <label class="form-label" for="firstName">First Name</label>
              <input type="text" class="form-control" id="firstName" formControlName="firstName" />
            </div>

            <div class="auth-input-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input type="text" class="form-control" id="lastName" formControlName="lastName" />
            </div>

            <div class="auth-input-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" formControlName="email" />
            </div>

            <button type="submit" [disabled]="settingsForm.invalid" class="auth-btn">Save</button>
          </form>
        }
      </div>

      <!-- Appearance Settings -->
      <div *ngIf="activeTab === 'appearance'">
        <h2>Appearance</h2>

        <div class="setting-item">
          <div>
            <span class="setting-label">Theme Color</span>
            <p class="setting-desc">Customise the theme color</p>
          </div>
          <div class="color-palette">
            <button
              *ngFor="let color of themeColors"
              class="color-box"
              [class.active]="selectedSidebarColor === color"
              [style.background]="color"
              (click)="setSidebarColor(color)"
            >
              <fa-icon *ngIf="selectedSidebarColor === color" icon="check" class="check-icon"></fa-icon>
            </button>

            <button
              class="color-box"
              [class.active]="selectedSidebarColor === '#' + customSidebarHexInput"
              [style.background]="'#' + customSidebarHexInput"
              (click)="setSidebarColor('#' + customSidebarHexInput)"
            >
              <fa-icon *ngIf="selectedSidebarColor === '#' + customSidebarHexInput" icon="check" class="check-icon"></fa-icon>
            </button>

            <div class="custom-color">
              <span>Custom</span>
              <div class="hex-input-container">
                <span>#</span>
                <input
                  type="text"
                  [(ngModel)]="customSidebarHexInput"
                  (input)="onCustomHexChange('sidebar')"
                  maxlength="6"
                  pattern="[A-Fa-f0-9]*"
                  class="color-hex-input"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="setting-item">
          <div>
            <span class="setting-label">Accent Color</span>
            <p class="setting-desc">Customise the accent color</p>
          </div>
          <div class="color-palette">
            <button
              *ngFor="let color of accentColors"
              class="color-box"
              [class.active]="selectedAccentColor === color"
              [style.background]="color"
              (click)="selectedAccentColor = color; updateAccentColor()"
            >
              <fa-icon *ngIf="selectedAccentColor === color" icon="check" class="check-icon"></fa-icon>
            </button>

            <button
              class="color-box"
              [class.active]="selectedAccentColor === '#' + customAccentHexInput"
              [style.background]="'#' + customAccentHexInput"
              (click)="selectedAccentColor = '#' + customAccentHexInput; updateAccentColor()"
            >
              <fa-icon *ngIf="selectedAccentColor === '#' + customAccentHexInput" icon="check" class="check-icon"></fa-icon>
            </button>

            <div class="custom-color">
              <span>Custom</span>
              <div class="hex-input-container">
                <span>#</span>
                <input
                  type="text"
                  [(ngModel)]="customAccentHexInput"
                  (input)="onCustomHexChange('accent')"
                  maxlength="6"
                  pattern="[A-Fa-f0-9]*"
                  class="color-hex-input"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="setting-item">
          <div>
            <span class="setting-label">Dark Mode</span>
            <p class="setting-desc">Toggle between light and dark mode</p>
          </div>

          <label class="toggle-switch">
            <input type="checkbox" [checked]="darkMode" (change)="toggleDarkMode()" />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Reset Button -->
        <button class="reset-btn" (click)="resetColors()">Reset to default</button>
      </div>
    </div>
  </div>
</div>
